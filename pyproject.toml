[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pacioli"
version = "0.1.0"
description = "Personal accounting for bank and credit card accounts, stored in CountAbout CSV format"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
pacioli = "pacioli.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
