[build-system]
requires = ["setuptools>=77"]  # for SPDX license metadata
build-backend = "setuptools.build_meta"

[project]
name = "doppia"
version = "0.1.0"
description = "Personal accounting for bank and credit card accounts, stored in CountAbout CSV format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dave Vandenbout" }]
requires-python = ">=3.10"
keywords = ["accounting", "personal finance", "ledger", "countabout", "bookkeeping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
doppia = "doppia.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
